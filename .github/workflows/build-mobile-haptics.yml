name: Build Mobile Haptics

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-haptics-source.zip'
      - 'build-mobile-haptics.yml'

env:
  GRADLE_VERSION: '9.6.0'
  NDK_VERSION: '27.2.12479018'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Extract source archive
        shell: bash
        run: |
          rm -rf /tmp/mobilehaptics-src
          mkdir -p /tmp/mobilehaptics-src
          unzip -q mobile-haptics-source.zip -d /tmp/mobilehaptics-src
          SRC_DIR="$(find /tmp/mobilehaptics-src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$SRC_DIR"
          cp -a "$SRC_DIR"/. .

      - name: Build Android native bridge (arm64 + x86_64)
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          mkdir -p src/main/resources/native/arm64-v8a src/main/resources/native/x86_64
          "$CLANG" --target=aarch64-linux-android24 -shared -fPIC -O2 \
            -isystem "$SYSROOT/usr/include" \
            src/main/cpp/mobilehaptics.cpp \
            -o src/main/resources/native/arm64-v8a/libmobilehaptics.so
          "$CLANG" --target=x86_64-linux-android24 -shared -fPIC -O2 \
            -isystem "$SYSROOT/usr/include" \
            src/main/cpp/mobilehaptics.cpp \
            -o src/main/resources/native/x86_64/libmobilehaptics.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mobile-haptics-1.21.11
          path: build/libs/mobile-haptics-1.21.11-*.jar
